const COLORS = [["a", "Светлый мандарин", "#ffc233"], ["b", "Мандарин", "#ff8e29"], ["c", "Тёмный мандарин", "#ff5a1f"]];
const state = { r: "b", c: "b" };
try { Object.assign(state, JSON.parse(localStorage.getItem("soft-mark") || "{}")); } catch {}
const color = () => COLORS.find(([k]) => k === state.c)[2];
const svg = (d, fill, size) => `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><path d="${d}" fill="${fill}"/></svg>`;
const GRAD = (id) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc233"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient></defs>`;

function render() {
  document.getElementById("radius").innerHTML =
    `<div class="tile ref"><div class="top"><span class="letter">—</span><span><div class="name">Сейчас</div><div class="desc">Острые углы, градиент</div></span></div><div class="art"><svg viewBox="0 0 64 64" aria-hidden="true">${GRAD("g0")}<path d="${D.now.big}" fill="url(#g0)"/></svg></div></div>` +
    RADII.map(([k, n, s]) => `<button type="button" class="tile" data-r="${k}" aria-pressed="${state.r === k}"><div class="top"><span class="letter">${k.toUpperCase()}</span><span><div class="name">${n}</div><div class="desc">${s}</div></span></div><div class="art">${svg(D[k].big, color(), 128)}</div></button>`).join("");
  document.getElementById("color").innerHTML = COLORS.map(([k, n, hex]) => `<button type="button" class="tile" data-c="${k}" aria-pressed="${state.c === k}"><div class="top"><span class="letter">${k.toUpperCase()}</span><span><div class="name">${n}</div><div class="desc">${hex}</div></span></div><div class="art">${svg(D[state.r].big, hex, 128)}</div></button>`).join("");
  const sizes = [[128, "big"], [64, "big"], [48, "big"], [32, "small"], [24, "small"], [16, "small"]];
  const strip = sizes.map(([s, v]) => `<div class="sz">${svg(D[state.r][v], color(), Math.min(s, 128))}<span>${s} px</span></div>`).join("");
  document.getElementById("try-dark").innerHTML = strip;
  document.getElementById("try-light").innerHTML = strip;
  const rn = RADII.find(([k]) => k === state.r)[1], cn = COLORS.find(([k]) => k === state.c)[1];
  document.getElementById("sum").textContent = `Знак: скругление ${state.r.toUpperCase()} «${rn}» · цвет ${state.c.toUpperCase()} «${cn}»`;
  try { localStorage.setItem("soft-mark", JSON.stringify(state)); } catch {}
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-r],[data-c]");
  if (!t) return;
  if (t.dataset.r) state.r = t.dataset.r;
  if (t.dataset.c) state.c = t.dataset.c;
  render();
});
document.getElementById("copy").addEventListener("click", async (e) => {
  const text = document.getElementById("sum").textContent;
  try { await navigator.clipboard.writeText(text); e.target.textContent = "Скопировано"; }
  catch { getSelection().selectAllChildren(document.getElementById("sum")); e.target.textContent = "Выделено"; }
  setTimeout(() => { e.target.textContent = "Скопировать"; }, 1500);
});
render();
</script>
